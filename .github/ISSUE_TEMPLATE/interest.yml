name: I'd like a go
description: Ask for a system design session with a deliberately unhelpful duck.
title: "Interested: "
body:
  - type: markdown
    attributes:
      value: |
        Five fields, most of them optional. Ninety seconds.

        Issues are public, so leave your employer out of it — "a large payments company" is plenty.
  - type: input
    id: role
    attributes:
      label: What role are you preparing for?
      description: Level and rough area. Precision unnecessary.
      placeholder: Senior backend / Staff infra / honestly whatever answers the phone
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When's the interview?
      options:
        - This week (bold of you to be here)
        - Within the month
        - Nothing booked, preparing anyway
        - Not looking, just want to practise thinking out loud
    validations:
      required: true
  - type: textarea
    id: weakness
    attributes:
      label: What do you suspect you're worst at?
      description: Guess. Being wrong about this is itself useful information, and it tells me where to sit quietly and wait.
      placeholder: I think I commit to a design too early / I go vague on the storage layer / I talk for forty minutes without drawing anything
    validations:
      required: false
  - type: input
    id: timezone
    attributes:
      label: Timezone
      placeholder: IST / UTC+5:30
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: Live is the point — the skill being rehearsed is persuading a human in real time. Async works, but it rehearses a different thing.
      options:
        - 45 minutes, live (the real shape of it)
        - 30 minutes, live
        - Async, in writing
    validations:
      required: true
  - type: dropdown
    id: reciprocate
    attributes:
      label: Would you sit on the other side of the table for someone else?
      description: Answer honestly rather than generously — an honest no is more useful to me than a polite maybe.
      options:
        - "Yes"
        - "No"
        - Maybe, once I've seen how it goes
    validations:
      required: true
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
    validations:
      required: false
